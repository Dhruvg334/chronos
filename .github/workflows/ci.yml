name: ChronOS checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_provider_checks:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22.12.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: python -m compileall -q app
        working-directory: backend
      - run: python -m pytest tests/test_evals.py tests/test_observability.py tests/test_rate_limits.py tests/test_security_controls.py tests/test_data_lifecycle.py tests/test_health.py tests/test_legacy_cleanup.py
        working-directory: backend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test -- --run data-controls
        working-directory: frontend
      - run: python scripts/secret_scan.py

  full:
    if: github.event_name != 'pull_request'
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22.12.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: python -m pytest
        working-directory: backend
      - run: npm run test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: supabase start --ignore-health-check
      - run: supabase db reset
      - run: supabase db lint --local

  provider-live:
    if: github.event_name == 'workflow_dispatch' && inputs.run_provider_checks
    needs: fast
    runs-on: ubuntu-latest
    environment: provider-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -m integration -k groq
        working-directory: backend
        env:
          RUN_GROQ_INTEGRATION: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_FAST: ${{ secrets.GROQ_MODEL_FAST }}
