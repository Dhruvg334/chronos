[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not integration" --strict-markers
markers =
    integration: opt-in tests that may use configured external services
    unit: deterministic tests that never use network services
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
    ignore:The 'timeout' parameter is deprecated.*
    ignore:The 'verify' parameter is deprecated.*
